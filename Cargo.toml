[package]
name = "cipher_client"
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
percent-encoding = "2.3.2"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Features per platform below (the defaults would pick the desktop backend on Android too).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2"] }
thiserror = "2.0.21"
ureq = "3.4.2"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true

# Native file dialogs; Android picks files through the system picker instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"
# Slint's default features, plus winit access (app/window.rs). That API is unstable: Slint asks for a
# `~` requirement with it, so a minor update is a deliberate change.
slint = { version = "~1.18.1", features = ["backend-default", "renderer-femtovg", "renderer-software", "accessibility", "system-tray", "unstable-winit-030"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06", "renderer-femtovg"] }
# Calls into the Java side (VPN consent, VpnService); same version as Slint's Android backend.
jni = { version = "0.22.4", default-features = false }
# Tunnel mode: feeds the VpnService TUN into sing-box's local SOCKS port.
tun2proxy = { version = "0.8.6", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
# Headless screenshots in tests (src/app/screenshots.rs)
slint = { version = "1.18.1", features = ["software-renderer-systemfonts", "software-renderer-path"] }
# Touch input as Android delivers it (not public Slint API, so pinned to slint's exact version)
i-slint-core = "=1.18.1"
