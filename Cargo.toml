[package]
name = "cipher_client"
version = "0.4.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
percent-encoding = "2.3.2"
rfd = "0.17.2"
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
thiserror = "2.0.21"
ureq = "3.4.2"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
# Headless screenshots in tests (src/app/screenshots.rs)
slint = { version = "1.18.1", features = ["software-renderer-systemfonts", "software-renderer-path"] }
